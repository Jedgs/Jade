<!DOCTYPE html>
<html>
	<head>
		<title>Simple JavaScript CRUD</title>
	</head>
	<body>
		<h1>Student CRUD System</h1>
		<input type="hidden" id="editIndex" value="-1">

		<label>Student ID:</label>
		<input type="text" id="studentId">
		<br><br>
		<label>Student Name:</label>
		<input type="text" id="studentName">
		<br><br>
		<label>Course:</label>
		<input type="text" id="studentCourse">
		<br><br>
		<input type="button" onclick="saveStudent()" value="Save Student">
		<button onclick="clearForm()">Cancel</button>

		<hr>

		<label>Search by Name:</label>
		<input type="text" id="searchName" oninput="searchStudent()">
		<button onclick="clearSearch()">Clear Search</button>

		<br><br>
		<button onclick="sortByName()">Sort by Name (A-Z)</button>

		<hr>
		<h2>Student Records</h2>
		<table border="1" cellpadding="10">
			<thead>
				<tr>
					<th>Number</th>
					<th>Student ID</th>
					<th>Name</th>
					<th>Course</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id="studentTable">
			</tbody>
		</table>

		<p id="studentCount">Total Students: 0</p>

		<script>
			let students = [];

			//Create and Update
			function saveStudent(){
				let id = document.getElementById("studentId").value.trim();
				let name = document.getElementById("studentName").value.trim();
				let course = document.getElementById("studentCourse").value.trim();
				let editIndex = parseInt(document.getElementById("editIndex").value);

				if(id == "" || name == "" || course == ""){
					alert("Please complete all fields");
					return;
				}

				//Check for duplicate Student ID (manual loop, ignore the record being edited)
				for(let index = 0; index < students.length; index++){
					if(index != editIndex && students[index].id.toLowerCase() == id.toLowerCase()){
						alert("A student with this ID already exists. Please use a unique Student ID.");
						return;
					}
				}

				//Check for duplicate Student Name (manual loop, ignore the record being edited)
				for(let index = 0; index < students.length; index++){
					if(index != editIndex && students[index].name.toLowerCase() == name.toLowerCase()){
						alert("A student with this name already exists. Duplicate names are not allowed.");
						return;
					}
				}

				if(editIndex == -1){
					//Create
					let newStudent = {
						id: id,
						name: name,
						course: course
					};
					//Add data without using push()
					students[students.length] = newStudent;
					alert("Student added successfully.");
				} else {
					//Update
					students[editIndex].id = id;
					students[editIndex].name = name;
					students[editIndex].course = course;
					alert("Student updated successfully");
				}

				clearForm();
				displayStudents();
			}

			//Read
			function displayStudents(list){
				let dataToShow = list;
				if(dataToShow == undefined){
					dataToShow = students;
				}

				let table = document.getElementById("studentTable");
				table.innerHTML = "";

				if(dataToShow.length == 0){
					table.innerHTML = "<tr>"
						+ "<td colspan='5'>No student records found.</td>" + "</tr>";
					updateStudentCount();
					return;
				}

				for(let index = 0; index < dataToShow.length; index++){					
					let realIndex = findStudentIndex(dataToShow[index].id);

					table.innerHTML +=
					"<tr>" +
					"<td>" + (index + 1) + "</td>" +
					"<td>" + dataToShow[index].id + "</td>" +
					"<td>" + dataToShow[index].name + "</td>" +
					"<td>" + dataToShow[index].course + "</td>" +
					"<td>" + "<button onclick='editStudent(" + realIndex + ")'>Edit</button> "
					+ "<button onclick='deleteStudent(" + realIndex + ")'>Delete</button>"
					+ "</td>" +
					"</tr>";
				}

				updateStudentCount();
			}

			//Locates a student's index 
			function findStudentIndex(id){
				for(let index = 0; index < students.length; index++){
					if(students[index].id == id){
						return index;
					}
				}
				return -1;
			}

			//Select student for editing
			function editStudent(index){
				document.getElementById("studentId").value = students[index].id;
				document.getElementById("studentName").value = students[index].name;
				document.getElementById("studentCourse").value = students[index].course;
				document.getElementById("editIndex").value = index;
			}

			//Delete
			function deleteStudent(index){
				let answer = confirm("Are you sure you want to delete this student?");
				if(answer == false){
					return;
				}
				/*
					Move every item after the selected index
					one position to the left.
				*/
				for (let position = index; position < students.length - 1; position++) {
					students[position] = students[position + 1];
				}
				//Reduce the array length to remove the last duplicate item
				students.length = students.length - 1;
				clearForm();
				clearSearch();
				alert("Student deleted successfully.");
			}

			//Clear the input fields
			function clearForm(){
				document.getElementById("studentId").value = "";
				document.getElementById("studentName").value = "";
				document.getElementById("studentCourse").value = "";
				document.getElementById("editIndex").value = "-1";
			}

			//Search Student
			function searchStudent(){
				let keyword = document.getElementById("searchName").value.trim().toLowerCase();

				if(keyword == ""){
					displayStudents();
					return;
				}

				let results = [];
				for(let index = 0; index < students.length; index++){
					let currentName = students[index].name.toLowerCase();

					if(containsKeyword(currentName, keyword)){
						results[results.length] = students[index];
					}
				}

				displayStudents(results);
			}

			//Manual substring search
			function containsKeyword(text, keyword){
				if(keyword.length == 0){
					return true;
				}
				for(let start = 0; start <= text.length - keyword.length; start++){
					let matched = true;
					for(let offset = 0; offset < keyword.length; offset++){
						if(text.charAt(start + offset) != keyword.charAt(offset)){
							matched = false;
							break;
						}
					}
					if(matched){
						return true;
					}
				}
				return false;
			}

			//Clear the search box and show all students again
			function clearSearch(){
				document.getElementById("searchName").value = "";
				displayStudents();
			}

			//Sort by Name
			function sortByName(){
				for(let outer = 0; outer < students.length - 1; outer++){
					for(let inner = 0; inner < students.length - 1 - outer; inner++){
						let nameA = students[inner].name.toLowerCase();
						let nameB = students[inner + 1].name.toLowerCase();

						if(nameA > nameB){
							let temp = students[inner];
							students[inner] = students[inner + 1];
							students[inner + 1] = temp;
						}
					}
				}
				clearSearch();
			}

			//Update the total student count display
			function updateStudentCount(){
				document.getElementById("studentCount").innerHTML = "Total Students: " + students.length;
			}

			// Initially display the empty table
			displayStudents();
		</script>
	</body>
</html>
